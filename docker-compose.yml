version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: skillpath-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - skillpath-network

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: skillpath-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8443
      - JWT_SECRET=skillpath-production-super-secret-jwt-key-2026
      - DATA_DIR=/app/data
      - MONGODB_URI=mongodb://mongodb:27017/skillpath
    volumes:
      - backend-data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - skillpath-network

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: skillpath-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillpath-network

networks:
  skillpath-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  mongo-data:
    driver: local
