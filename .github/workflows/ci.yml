name: CI / Quality Assurance Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install Dependencies
        working-directory: app/backend
        run: npm ci

      - name: Type Check & Lint
        working-directory: app/backend
        run: npm run lint

      - name: Run Integration Tests
        working-directory: app/backend
        run: npm test

      - name: Build Production Bundle
        working-directory: app/backend
        run: npm run build

  frontend-checks:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: app/frontend
        run: npm run build

  docker-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          tags: skillpath-backend:test

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          tags: skillpath-frontend:test
